name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black==24.10.0

      - name: Check formatting and lint on changed Python files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            git ls-files '*.py' > /tmp/python-files.txt
          else
            git diff --name-only --diff-filter=ACMRT "$base"...HEAD -- '*.py' > /tmp/python-files.txt
          fi
          mapfile -t files < /tmp/python-files.txt
          if ((${#files[@]})); then
            black --check --diff "${files[@]}"
            ruff check "${files[@]}"
          else
            echo "No changed Python files to format-check or lint."
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure private package access
        run: |
          GH_PAT=$(gcloud secrets versions access latest --secret=GITHUB_TOKEN --project=apps-aecs4u)
          echo "::add-mask::${GH_PAT}"
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked project and test dependencies
        run: uv sync --frozen --group dev --extra dev

      - name: Install Playwright browsers
        run: .venv/bin/playwright install chromium --with-deps

      - name: Run tests
        run: .venv/bin/python -m pytest -v --tb=short || [ $? -eq 5 ]
        env:
          ADE_USERNAME: test
          ADE_PASSWORD: test

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export locked PyPI dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --no-emit-package aecs4u-analytics \
            --no-emit-package aecs4u-auth \
            --no-emit-package aecs4u-billing \
            --no-emit-package aecs4u-crypto \
            --no-emit-package aecs4u-dashboard \
            --no-emit-package aecs4u-documents \
            --no-emit-package aecs4u-domain \
            --no-emit-package aecs4u-email \
            --no-emit-package aecs4u-finance \
            --no-emit-package aecs4u-i18n \
            --no-emit-package aecs4u-notifications \
            --no-emit-package aecs4u-stats \
            --no-emit-package aecs4u-storage \
            --no-emit-package aecs4u-theme \
            --no-emit-package aecs4u-workflow \
            --no-emit-package land-registry \
            --no-emit-package ocular \
            --no-emit-package property-scraper \
            --no-emit-package python-codicefiscale \
            --format requirements-txt > /tmp/requirements-audit.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit locked PyPI dependencies
        run: |
          # No fixed release is currently published for these two advisories.
          pip-audit --no-deps -r /tmp/requirements-audit.txt \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-4298
