[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sister"
version = "1.2.0"
description = "SISTER — Servizio API e CLI per l'estrazione automatizzata di dati catastali dal portale SISTER dell'Agenzia delle Entrate"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.12"
authors = [
    {name = "SISTER Contributors"}
]
keywords = ["catasto", "visura", "sister", "agenzia-entrate", "api", "fastapi", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Framework :: FastAPI",
]

dependencies = [
    "aecs4u-auth>=1.19.0",  # no [browser]: Playwright is not a production dependency (see the browser extra / dev group)
    "aecs4u-domain>=0.12.0",
    "aecs4u-email>=1.0.0",
    "aecs4u-storage>=0.2.0",  # company Google Drive for the shared reports (drive_share.py)
    "aecs4u-crypto>=0.2.0",
    "aecs4u-workflow>=0.1.0",
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "structlog>=26.0.0",
    "uvicorn>=0.32.0",
    "beautifulsoup4",
    "pydantic>=2.10.0",
    "python-dotenv",
    "rich>=13.0",
    "psycopg[binary]>=3.2.0",
    "sqlmodel>=0.0.8",
    "alembic>=1.13.0",
    "typer>=0.9.0",
    "httpx>=0.27.0,<1",  # 1.0 pre-releases drop AsyncClient (breaks VisuraClient); uv.lock pins 0.28.1
    "pillow>=10",  # PDF report: OpenStreetMap basemap of the parcel sketches
    "jinja2>=3.1.0",
    "land_registry>=0.1.4",
    "aecs4u-theme>=1.6.0",
    "lxml>=6.1.1",
    "sqlalchemy[asyncio]>=2.0.50",  # greenlet: async engine (it used to arrive only through Playwright)
    "starlette>=1.6.0",
    "python-multipart>=0.0.32",
    "ezdxf>=1.4.4",
    "typst>=0.14",  # PDF export (sister/pdf_typst.py, template in sister/typst/)
]

[project.optional-dependencies]
floor-plan-ocr = [
    "ocular[promptflow]",
]
mcp = [
    "mcp>=2.0.0,<3",
]
# Portal automation and UI audits need Playwright; they run on a workstation next to the shared Chrome, never in production.
browser = [
    "aecs4u-auth[browser]>=1.19.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aecs4u/sister"
Repository = "https://github.com/aecs4u/sister"
Issues = "https://github.com/aecs4u/sister/issues"
Changelog = "https://github.com/aecs4u/sister/blob/main/docs/CHANGELOG.md"

[project.scripts]
sister = "sister.cli:run"
sister-mcp = "sister.mcp_server:run"

[tool.uv.sources]
aecs4u-auth = { git = "https://github.com/aecs4u/aecs4u-auth.git", branch = "main" }
aecs4u-domain = { git = "https://github.com/aecs4u/aecs4u-domain.git", branch = "main" }
aecs4u-storage = { git = "https://github.com/aecs4u/aecs4u-storage.git", branch = "main" }
aecs4u-email = { git = "https://github.com/aecs4u/aecs4u-email.git", branch = "main" }
aecs4u-crypto = { git = "https://github.com/aecs4u/aecs4u-crypto.git", branch = "main" }
aecs4u-theme = { git = "https://github.com/aecs4u/aecs4u-theme.git", branch = "main" }
land_registry = { git = "https://github.com/aecs4u/land-registry.git", branch = "main" }
aecs4u-workflow = { git = "https://github.com/aecs4u/aecs4u-workflow.git", branch = "main" }
ocular = { git = "https://github.com/aecs4u/ocular.git", branch = "main" }

[tool.uv]
# Keep the OCR extra's older upstream caps from locking vulnerable releases.
# Logfire 5.6 supports OpenTelemetry <1.46; PromptFlow uses Pillow for icon encoding.
override-dependencies = [
    "opentelemetry-api>=1.45.2,<1.46.0",
    "opentelemetry-sdk>=1.45.2,<1.46.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<1.46.0",
    "pillow>=13.0.0,<14.0.0",
]

[tool.setuptools]
packages = ["sister", "sister.cli", "sister.command_tools", "sister.command_tools.ui_audit"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: tests that use developer-local or external service data",
    "live: tests that require live service access",
]

[tool.deptry]
exclude = ["alembic", "examples", "scripts"]

[tool.deptry.package_module_name_map]
beautifulsoup4 = ["bs4"]
python-dotenv  = ["dotenv"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",         # runtime server — invoked via CLI
    "jinja2",          # templating, implicit via fastapi
    "pytest-cov",      # dev tool in optional-dependencies
    "pytest-asyncio",  # dev tool
    "black",           # dev tool
    "ruff",            # dev tool
    "aecs4u-theme>=1.6.0",    # static files via importlib / mount
]
DEP001 = [
    "playwright",      # optional, comes via the browser extra / dev group (aecs4u-auth[browser]) — not a direct dep
]

[dependency-groups]
dev = [
    "aecs4u-auth[browser]>=1.19.0",  # Playwright for local portal sessions and UI audits
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
