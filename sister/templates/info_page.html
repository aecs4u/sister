{% extends "_base.html" %}
{% block page_title %}{{ page_heading }}{% endblock %}

{% block content %}
<div class="container py-5">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ page_heading }}</li>
        </ol>
    </nav>
    <h1 class="mb-4"><i class="fas {{ page_icon }} text-primary me-2" aria-hidden="true"></i>{{ page_heading }}</h1>
    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body info-page-body">
                    {% block info_body %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
