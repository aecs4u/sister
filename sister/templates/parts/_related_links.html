{% macro related_pages(title, links, description='') %}
<section class="card border-0 shadow-sm my-4" aria-label="{{ title }}">
    <div class="card-body p-3 p-lg-4">
        <div class="mb-3">
            <h2 class="h5 mb-1"><i class="fas fa-compass text-primary me-2"></i>{{ title }}</h2>
            {% if description %}<p class="text-muted small mb-0">{{ description }}</p>{% endif %}
        </div>
        <div class="row g-2">
            {% for href, label, summary, icon in links %}
            <div class="col-sm-6 col-xl-3">
                <a class="d-flex gap-2 align-items-start h-100 p-3 border rounded text-decoration-none"
                   href="{{ href }}">
                    <i class="fas {{ icon }} text-primary mt-1" aria-hidden="true"></i>
                    <span>
                        <span class="d-block fw-semibold">{{ label }}</span>
                        <span class="d-block small text-muted">{{ summary }}</span>
                    </span>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endmacro %}
