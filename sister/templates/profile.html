{% extends "_base.html" %}
{% block page_title %}Profile{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h1 class="h2 mb-4"><i class="fas fa-user text-primary me-2"></i>Profile</h1>
    <div class="card border-0 shadow-sm" style="max-width: 40rem;">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4">Username</dt>
                <dd class="col-sm-8">{{ user.username or user.email or '—' }}</dd>
                <dt class="col-sm-4">Email</dt>
                <dd class="col-sm-8">{{ user.email or '—' }}</dd>
                <dt class="col-sm-4">Name</dt>
                <dd class="col-sm-8">{{ user.full_name or '—' }}</dd>
                <dt class="col-sm-4">Role</dt>
                <dd class="col-sm-8">{{ user.role or 'user' }}</dd>
            </dl>
        </div>
        <div class="card-footer bg-transparent">
            <a class="btn btn-outline-danger btn-sm" href="/auth/logout"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
    </div>
</div>
{% endblock %}
