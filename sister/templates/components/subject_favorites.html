{% macro subject_favorite_button(subject_code, enabled=true, favorite=false, subject_type='company') %}
<button type="button"
        class="btn btn-sm {{ 'btn-danger' if favorite else 'btn-outline-secondary' }} subject-favorite-toggle"
        data-subject-favorite
        data-subject-type="{{ subject_type }}"
        data-subject-code="{{ subject_code }}"
        data-favorite-url="/{{ 'companies' if subject_type == 'company' else 'persons' }}/{{ subject_code }}/favorite"
        aria-pressed="{{ 'true' if favorite else 'false' }}"
        aria-label="{{ 'Rimuovi dai preferiti' if favorite else 'Aggiungi ai preferiti' }}"
        title="{{ 'Rimuovi dai preferiti' if favorite else 'Aggiungi ai preferiti' }}"
        {% if not enabled %}disabled title="Accedi per salvare i preferiti"{% endif %}>
    <i class="{{ 'fas' if favorite else 'far' }} fa-heart me-1" aria-hidden="true"></i>
    <span data-subject-favorite-label>{{ 'Nei preferiti' if favorite else 'Aggiungi ai preferiti' }}</span>
</button>
{% endmacro %}

{% macro subject_favorites_js(nonce='') %}
<script nonce="{{ nonce }}">
(function () {
    function updateButton(button, favorite) {
        var icon = button.querySelector('i');
        button.classList.toggle('btn-danger', favorite);
        button.classList.toggle('btn-outline-secondary', !favorite);
        button.setAttribute('aria-pressed', favorite ? 'true' : 'false');
        var label = favorite ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti';
        button.setAttribute('aria-label', label);
        button.title = label;
        var text = button.querySelector('[data-subject-favorite-label]');
        if (text) text.textContent = favorite ? 'Nei preferiti' : 'Aggiungi ai preferiti';
        if (icon) icon.className = (favorite ? 'fas' : 'far') + ' fa-heart me-1';
    }

    document.addEventListener('click', function (event) {
        var button = event.target.closest('[data-subject-favorite]');
        if (!button || button.disabled) return;
        var favorite = button.getAttribute('aria-pressed') !== 'true';
        button.disabled = true;
        fetch(button.dataset.favoriteUrl, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({favorite: favorite})
        }).then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
        }).then(function (result) {
            document.querySelectorAll('[data-subject-favorite]').forEach(function (peer) {
                if (peer.dataset.subjectType !== button.dataset.subjectType ||
                    peer.dataset.subjectCode !== button.dataset.subjectCode) return;
                updateButton(peer, result.favorite === true);
                peer.disabled = false;
            });
            if (!result.favorite) {
                var row = button.closest('[data-subject-favorite-item]');
                if (row) row.remove();
                var section = button.closest('[data-subject-favorites-section]');
                var list = section ? section.querySelector('[data-subject-favorites-list]') : null;
                if (list && !list.querySelector('[data-subject-favorite-item]')) list.hidden = true;
                if (section && !section.querySelector('[data-subject-favorite-item]')) section.hidden = true;
                var total = document.querySelectorAll('[data-favorite-item], [data-subject-favorite-item]').length;
                var count = document.querySelector('[data-favorites-count]');
                if (count) count.textContent = String(total);
                var emptyState = document.querySelector('[data-favorites-empty]');
                if (emptyState) emptyState.hidden = total !== 0;
            } else {
                var addCount = document.querySelector('[data-favorites-count]');
                if (addCount) {
                    var current = Number(addCount.textContent) || 0;
                    addCount.textContent = String(current + 1);
                }
            }
        }).catch(function (error) {
            button.disabled = false;
            window.alert('Impossibile aggiornare i preferiti (' + error.message + ').');
        });
    });
})();
</script>
{% endmacro %}
